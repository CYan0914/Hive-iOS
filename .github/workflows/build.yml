name: Build Hive

on:
  workflow_dispatch:
    inputs:
      create_ipa:
        description: 'Build a signed IPA and upload it to TestFlight'
        required: false
        default: false
        type: boolean
  push:
    branches: [main, master]

# The group is keyed by what the run is for: a plain push and a manual
# TestFlight run share a branch but must not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.create_ipa || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: Build and test for iOS Simulator
    if: github.event_name == 'push' || github.event.inputs.create_ipa != 'true'
    # Intel pool on purpose. Two consecutive runs died after 15 minutes in the
    # arm64 queue ("job was not acquired by Runner of type hosted") without
    # compiling a single line.
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          for xc in /Applications/Xcode*.app; do
            if sudo xcode-select -s "$xc/Contents/Developer" 2>/dev/null; then
              sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "unknown")
              echo "  $xc -> iOS SDK $sdk"
              if [[ "$sdk" == 2[6-9].* ]] || [[ "$sdk" == [3-9]* ]]; then
                echo "Selected: $xc (iOS SDK $sdk)"
                xcodebuild -version
                exit 0
              fi
            fi
          done
          echo "No Xcode with SDK 26+ found -- falling back"
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null
          xcodegen --version

      - name: Generate Xcode project
        run: |
          rm -rf Hive.xcodeproj
          xcodegen generate

      - name: Ensure the iOS platform is installed
        run: |
          sudo xcodebuild -license accept 2>&1 || true
          sudo xcodebuild -runFirstLaunch 2>&1 || true
          for i in 1 2 3; do
            echo "Attempt $i..."
            sudo xcodebuild -downloadPlatform iOS -quiet 2>&1 && break
            echo "Attempt $i failed, sleeping 15s..."
            sleep 15
          done
          xcrun --sdk iphonesimulator --show-sdk-version || true

      - name: Build for Simulator
        run: |
          # Unsigned on purpose: this step answers "does it compile". Pulling
          # signing in would make a Swift error and a certificate problem look
          # identical.
          set +e
          xcodebuild build \
            -project Hive.xcodeproj \
            -scheme Hive \
            -sdk iphonesimulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1
          status=$?
          set -e

          if [ $status -ne 0 ]; then
            echo "::group::errors"
            grep -nE "error:|error :|fatal" build.log | head -60 || true
            echo "::endgroup::"
            echo "::group::last 140 lines of the raw log"
            tail -140 build.log
            echo "::endgroup::"
            exit $status
          fi
          grep -cE "warning:" build.log || true

      - name: Build the local server
        run: |
          # The server reuses Models/Services, so a change that breaks the app
          # for macOS-only reasons should fail here rather than on the user's
          # machine.
          set +e
          xcodebuild build \
            -project Hive.xcodeproj \
            -scheme HiveServer \
            -sdk macosx \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > server.log 2>&1
          status=$?
          set -e

          if [ $status -ne 0 ]; then
            echo "::group::server errors"
            grep -nE "error:|fatal" server.log | head -60 || true
            echo "::endgroup::"
            tail -120 server.log
            exit $status
          fi

      - name: Run unit tests
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -m1 -E "iPhone" \
            | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          if [ -z "$UDID" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"

          set +e
          xcodebuild test \
            -project Hive.xcodeproj \
            -scheme Hive \
            -destination "id=$UDID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1
          status=$?
          set -e

          grep -nE "error:|failed|XCTAssert" test.log | head -40 || true
          if [ $status -ne 0 ]; then
            echo "::group::last 160 lines"
            tail -160 test.log
            echo "::endgroup::"
            exit $status
          fi
          grep -E "Test Suite|Executed .* test" test.log | tail -20 || true

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            server.log
            test.log
          retention-days: 7

  # ─── Signed IPA → TestFlight (manual, create_ipa=true) ───────────────────
  #
  # Requires, as repository secrets:
  #   DIST_CERT_P12 / DIST_CERT_PASSWORD   base64 of the .p12 and its password
  #   DIST_PROFILE                          base64 of the .mobileprovision
  #   DIST_PROFILE_SPECIFIER                the profile's name
  #   APPSTORE_KEY_ID / APPSTORE_ISSUER_ID / APPSTORE_API_KEY
  #
  # And an app record in App Store Connect for com.cyan0914.hive. That record
  # cannot be created through the API — it is a web-UI job.
  archive:
    name: Archive and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_ipa == 'true'
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(none found)"
          for xc in /Applications/Xcode*.app; do
            if sudo xcode-select -s "$xc/Contents/Developer" 2>/dev/null; then
              sdk=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo "unknown")
              echo "  $xc -> iOS SDK $sdk"
              if [[ "$sdk" == 2[6-9].* ]] || [[ "$sdk" == [3-9]* ]]; then
                echo "Selected: $xc (iOS SDK $sdk)"
                xcodebuild -version
                exit 0
              fi
            fi
          done
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null
          xcodegen --version

      - name: Generate Xcode project
        run: |
          rm -rf Hive.xcodeproj
          xcodegen generate

      - name: Ensure the iOS platform is installed
        run: |
          sudo xcodebuild -license accept 2>&1 || true
          sudo xcodebuild -runFirstLaunch 2>&1 || true
          for i in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS -quiet 2>&1 && break
            sleep 15
          done
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: Import distribution identity
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DIST_PROFILE: ${{ secrets.DIST_PROFILE }}
        run: |
          set -e
          if [ -z "$DIST_CERT_P12" ]; then
            echo "::error::DIST_CERT_P12 未配置，先按 README 的 TestFlight 章节配置 secrets。"
            exit 1
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$DIST_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/hive.mobileprovision
          printf '%s' "$DIST_CERT_P12" | base64 --decode > /tmp/dist.p12

          security create-keychain -p "" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          if ! security import /tmp/dist.p12 -k build.keychain \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild; then
            echo "::error::无法导入分发证书 p12。"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain > /dev/null
          rm -f /tmp/dist.p12

          if ! security find-identity -v -p codesigning build.keychain \
               | grep -q "Apple Distribution"; then
            echo "::error::导入后没有 Apple Distribution 身份。"
            exit 1
          fi

      - name: Archive
        env:
          DIST_PROFILE_SPECIFIER: ${{ secrets.DIST_PROFILE_SPECIFIER }}
        run: |
          xcodebuild archive \
            -project Hive.xcodeproj \
            -scheme Hive \
            -configuration Release \
            -sdk iphoneos \
            -archivePath Hive.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$DIST_PROFILE_SPECIFIER" \
            DEVELOPMENT_TEAM=H4VQ9X6KYK \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

          codesign -dv --verbose=4 \
            Hive.xcarchive/Products/Applications/Hive.app 2>&1 \
            | grep -E "Authority|Identifier|TeamIdentifier" || true

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath Hive.xcarchive \
            -exportPath ./ipa \
            -exportOptionsPlist ExportOptions.plist

          ls -la ipa/

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          xcrun altool --upload-app \
            -f ipa/Hive.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --type ios \
            --verbose 2>&1
